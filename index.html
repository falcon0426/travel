    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f0f2f5;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Material Design Colors */
        :root {
            --primary: #3f51b5; /* Indigo 500 */
            --primary-dark: #303f9f;
            --accent: #ff5252; /* Crab Red */
            --secondary: #00bcd4; /* Ocean Blue */
            --surface: #ffffff;
            --background: #f0f2f5;
            --text-primary: #212121;
            --text-secondary: #757575;
        }

        .material-card {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 2px 4px -1px rgba(0,0,0,0.1), 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .material-card.active {
            border-left: 6px solid var(--accent);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            background-color: #fff8f8;
            transform: scale(1.02);
        }

        .material-card.past {
            opacity: 0.6;
            filter: grayscale(0.8);
        }

        .timeline-line {
            position: absolute;
            left: 24px;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #e0e0e0;
            z-index: 0;
        }

        .timeline-dot {
            position: relative;
            z-index: 10;
        }

        /* Sticky Date Header */
        .sticky-header {
            position: sticky;
            top: 60px; /* Below Main Header */
            z-index: 20;
            background-color: rgba(240, 242, 245, 0.95);
            backdrop-filter: blur(5px);
            padding: 8px 0;
            margin-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        /* Animation for current item */
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 82, 82, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0); }
        }
        
        .status-badge {
            animation: pulse-border 2s infinite;
        }

        /* Sim Mode Controls */
        #sim-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(33, 33, 33, 0.95);
            color: white;
            padding: 16px;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }
        #sim-controls.open {
            transform: translateY(0);
        }
    </style>
</head>

                    icon: "shopping-bag"

            // --- Logic ---

            let simMode = false;
            let simTimeOffset = 0; // Difference between real time and sim time
            let currentSimTime = new Date(); // Holds the simulated time

            window.getNow = function() {
                if (simMode) {
                    return currentSimTime;
                }
                return new Date();
            };

            function formatTime(date) {
                return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            }

            function formatDate(date) {
                return date.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
            }

            // Render the itinerary
            function renderItinerary() {
                const container = document.getElementById('itinerary-container');
                container.innerHTML = '';
                
                let currentDay = 0;

                itinerary.forEach((item, index) => {
                    // Determine item status based on Simulated/Real time
                    const now = window.getNow();
                    const itemStart = new Date(`${item.date}T${item.time}:00`);
                    const itemEnd = item.endTime ? new Date(`${item.date}T${item.endTime}:00`) : new Date(itemStart.getTime() + 60*60*1000);
                    
                    let statusClass = "";
                    let badge = "";
                    
                    if (now > itemEnd) {
                        statusClass = "past";
                    } else if (now >= itemStart && now <= itemEnd) {
                        statusClass = "active";
                        badge = `<span class="status-badge absolute top-2 right-2 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-full shadow-sm z-10">NOW</span>`;
                    } else {
                        statusClass = "future";
                        // Check if this is the VERY NEXT event
                        const prevItemEnd = index > 0 ? new Date(`${itinerary[index-1].date}T${itinerary[index-1].endTime}:00`) : new Date(0);
                        if (now < itemStart && now > prevItemEnd) {
                             statusClass = "next ring-2 ring-blue-300";
                             badge = `<span class="absolute top-2 right-2 bg-blue-500 text-white text-[10px] font-bold px-2 py-1 rounded-full shadow-sm z-10">NEXT</span>`;
                        }
                    }

                    // Add Day Header if changed
                    if (item.day !== currentDay) {
                        currentDay = item.day;
                        const dayHeader = document.createElement('div');
                        dayHeader.className = "sticky-header flex items-center justify-between text-indigo-900 font-bold px-4 rounded-lg shadow-sm";
                        dayHeader.innerHTML = `
                            <span>Day ${item.day}</span>
                            <span class="text-sm font-normal text-gray-500">${item.date}</span>
                        `;
                        container.appendChild(dayHeader);
                    }

                    // Create Card
                    const card = document.createElement('div');
                    card.className = `material-card relative p-4 mb-6 ml-6 ${statusClass}`;
                    card.id = `event-${index}`;
                    
                    // Icon Color Logic
                    let iconColor = "text-gray-500";
                    let iconBg = "bg-gray-100";
                    if (item.type === "transport") { iconColor = "text-blue-500"; iconBg = "bg-blue-50"; }
                    if (item.type === "food") { iconColor = "text-orange-500"; iconBg = "bg-orange-50"; }
                    if (item.type === "hotel") { iconColor = "text-indigo-500"; iconBg = "bg-indigo-50"; }
                    if (item.type === "important") { iconColor = "text-red-600"; iconBg = "bg-red-50"; }
                    if (item.type === "activity") { iconColor = "text-green-600"; iconBg = "bg-green-50"; }

                    card.innerHTML = `
                        ${badge}
                        <!-- Timeline connector -->
                        <div class="absolute -left-[33px] top-6 flex flex-col items-center">
                             <div class="timeline-dot w-4 h-4 rounded-full border-2 border-white shadow-sm ${statusClass === 'active' ? 'bg-red-500 scale-125' : 'bg-gray-400'}"></div>
                        </div>
                        
                        <div class="flex items-start gap-4">
                            <div class="flex-shrink-0 w-12 text-center">
                                <div class="text-lg font-bold text-gray-800 leading-none">${item.time}</div>
                                <div class="text-xs text-gray-400 mt-1">~${item.endTime || ''}</div>
                            </div>
                            
                            <div class="flex-grow">
                                <div class="flex items-center gap-2 mb-1">
                                    <div class="p-1.5 rounded-full ${iconBg} ${iconColor}">
                                        <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                                    </div>
                                    <h3 class="font-bold text-gray-800 text-lg leading-tight">${item.title}</h3>
                                </div>
                                
                                <div class="text-sm text-indigo-600 font-medium mb-2 flex items-center gap-1">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i> ${item.location}
                                </div>
                                
                                <div class="text-sm text-gray-600 bg-gray-50 p-3 rounded-lg border border-gray-100">
                                    ${item.desc}
                                </div>
                            </div>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });

                // Add Vertical Line
                const line = document.createElement('div');
                line.className = "timeline-line";
                container.prepend(line);

                // Re-initialize icons
                if (window.lucide) {
                    lucide.createIcons();
                }
            }

            function updateClock() {
                const now = window.getNow();
                const dateEl = document.getElementById('header-date');
                const timeEl = document.getElementById('header-time');
                if(dateEl && timeEl) {
                    dateEl.innerText = formatDate(now);
                    timeEl.innerText = formatTime(now);
                }
                
                // Only re-render if minute changed (optimization)
                if (now.getSeconds() === 0 || simMode) {
                   renderItinerary();
                }
            }

            window.scrollToActive = function() {
                const active = document.querySelector('.active') || document.querySelector('.next') || document.querySelector('.future');
                if (active) {
                    active.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            // --- Simulation Logic ---
            const slider = document.getElementById('sim-slider');
            const totalDuration = tripEnd - tripStart;

            window.toggleSim = function() {
                const controls = document.getElementById('sim-controls');
                controls.classList.toggle('open');
                simMode = true; // Activate sim mode when opened
                updateSimFromSlider();
            };

            window.resetToRealTime = function() {
                simMode = false;
                document.getElementById('sim-controls').classList.remove('open');
                updateClock();
                renderItinerary();
                setTimeout(window.scrollToActive, 300);
            };

            window.setSimTime = function(isoString) {
                simMode = true;
                currentSimTime = new Date(isoString);
                // Update slider position
                const percent = ((currentSimTime.getTime() - tripStart) / totalDuration) * 100;
                slider.value = percent;
                updateClock();
                renderItinerary();
                window.scrollToActive();
            };

            function updateSimFromSlider() {
                if (!simMode) return;
                const percent = slider.value;
                const time = tripStart + (totalDuration * (percent / 100));
                currentSimTime = new Date(time);
                updateClock();
                renderItinerary();
            }

            if (slider) {
                slider.addEventListener('input', updateSimFromSlider);
            }

            // --- Initialization ---
            setInterval(updateClock, 1000); // Clock tick
            
            // Initial Render
            // Default to Real Time, but since 2026 is far, let's start Simulation at Day 1 Start for better UX
            // Unless we are actually IN 2026.
            if (new Date().getFullYear() < 2026) {
                window.setSimTime("2026-02-13T14:30:00"); // Start just before arrival
                setTimeout(() => {
                     const ctrl = document.getElementById('sim-controls');
                     if(ctrl) ctrl.classList.add('open');
                }, 1000);
            } else {
                renderItinerary();
                window.scrollToActive();
            }

            // Show FAB on scroll
            window.addEventListener('scroll', () => {
                const fab = document.getElementById('fab-current');
                if (fab) {
                    if (window.scrollY > 200) {
                        fab.classList.remove('hidden');
                    } else {
                        fab.classList.add('hidden');
                    }
                }
            });
        });
    </script>
</body>
</html>
